name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh uninstall.sh
      - name: Stage installation payload twice
        run: |
          root="$RUNNER_TEMP/ispconfig-rspamd-trainer-root"
          ./install.sh --stage "$root"
          sha256sum "$root/usr/share/doc/ispconfig-rspamd-trainer/install-manifest.json" > "$RUNNER_TEMP/manifest-1"
          ./install.sh --stage "$root"
          sha256sum "$root/usr/share/doc/ispconfig-rspamd-trainer/install-manifest.json" > "$RUNNER_TEMP/manifest-2"
          cmp "$RUNNER_TEMP/manifest-1" "$RUNNER_TEMP/manifest-2"
          test -z "$(find "$root" \( -name '*.bak.*' -o -name '__pycache__' -o -name '*.pyc' \) -print -quit)"
          test ! -d "$root/etc/dovecot/conf.d"
      - name: PHP and ISPConfig language syntax
        run: find ispconfig bin \( -name '*.php' -o -name '*.lng' \) -print0 | xargs -0 -n1 php -l
      - name: Install Dovecot Sieve compiler
        run: sudo apt-get update && sudo apt-get install -y dovecot-sieve
      - name: Sieve syntax
        run: |
          mkdir -p /tmp/ispcrt-sieve
          for script in dovecot/sieve/*.sieve; do
            sievec -P sieve_imapsieve -P sieve_extprograms \
              -x '+vnd.dovecot.pipe +vnd.dovecot.environment' \
              "$script" "/tmp/ispcrt-sieve/$(basename "$script").svbin"
          done
